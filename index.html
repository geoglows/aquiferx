
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aquifer Analyst</title>
  <script>
    // A remembered dark theme goes on before first paint, so the page never
    // flashes light on the way to it. utils/theme.ts takes over from here.
    try { if (localStorage.getItem('aqx-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch {}
  </script>
  <style>
    /* Ensure Leaflet controls don't overlap our UI */
    .leaflet-container {
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    /* Fix tile seam artifacts at fractional zoom levels */
    .leaflet-tile {
      image-rendering: -webkit-optimize-contrast;
      outline: 1px solid transparent;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
